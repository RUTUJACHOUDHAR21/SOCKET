<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FastAPI WebSocket Chat</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h2 {
      color: #333;
    }
    #chatBox {
      width: 100%;
      max-width: 500px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      overflow-y: auto;
      height: 400px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .message {
      margin: 5px 0;
      padding: 10px;
      background: #e1f5fe;
      border-radius: 5px;
    }
    .self {
      background: #c8e6c9;
      text-align: right;
    }
    .system {
      background: #ffe082;
      font-style: italic;
      text-align: center;
    }
    #form {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }
    input {
      flex-grow: 1;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background: #1976d2;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #1565c0;
    }
  </style>
</head>
<body>
  <h2>🧑‍💻 Real-Time Chat (FastAPI + WebSocket)</h2>
  <div id="chatBox"></div>
  <div id="form">
    <input id="msgInput" type="text" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const username = prompt("Enter your username:");
    const socket = new WebSocket("wss://" + location.host + "/ws");
    const chatBox = document.getElementById("chatBox");
    const msgInput = document.getElementById("msgInput");

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: "join", username }));
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const msg = document.createElement("div");

      const timestamp = new Date(data.time).toLocaleTimeString();

      if (data.type === "message") {
        msg.classList.add("message");
        if (data.username === username) msg.classList.add("self");
        msg.textContent = `[${timestamp}] ${data.username}: ${data.text}`;
      } else if (data.type === "system") {
        msg.classList.add("message", "system");
        msg.textContent = `[${timestamp}] ${data.text}`;
      }

      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    };

    function sendMessage() {
      if (msgInput.value.trim() !== "") {
        socket.send(JSON.stringify({ type: "message", username, text: msgInput.value }));
        msgInput.value = "";
      }
    }

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    window.addEventListener("beforeunload", () => {
      socket.send(JSON.stringify({ type: "leave", username }));
    });
  </script>
</body>
</html>
